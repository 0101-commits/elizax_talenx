<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성과관리 Agent — 신호 카드 프리뷰</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F5F4F0; --panel:#FFFFFF; --ink:#1C1B19; --ink2:#5F5E58; --ink3:#95938C;
    --line:#E5E3DC; --line2:#D4D2C9;
    --accent:#1D6F53; --accent-soft:#E4F1EA; --accent-ink:#124A37;
    --amber:#B87514; --amber-soft:#F8EDD8; --amber-ink:#6B430A;
    --coral:#C24B26; --coral-soft:#FADFD4; --coral-ink:#7A2C13;
    --blue:#2C6DB0; --blue-soft:#E4EFF9; --blue-ink:#194875;
    --purple:#6A5AC4; --purple-soft:#ECE9FA; --purple-ink:#3E3487;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;padding:26px 18px 90px}
  .wrap{max-width:600px;margin:0 auto}

  .top{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .top .mark{font-size:19px;color:var(--accent)}
  .top h1{font-size:16px;font-weight:600}
  .persona{margin-left:auto;display:flex;gap:3px;background:#EAE8E1;padding:3px;border-radius:9px}
  .pbtn{font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;padding:6px 11px;
    border:none;border-radius:7px;background:transparent;color:var(--ink3);transition:.15s}
  .pbtn.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  .tabs{display:flex;gap:4px;background:#EAE8E1;padding:4px;border-radius:11px;margin-bottom:20px}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;
    font-size:13.5px;font-weight:500;cursor:pointer;padding:9px 0;border:none;border-radius:8px;
    background:transparent;color:var(--ink3);transition:.18s}
  .tab .ti{font-size:15px}
  .tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .tab .badge{font-size:10.5px;background:var(--coral);color:#fff;border-radius:999px;padding:1px 6px;font-weight:600}

  .panel{display:none}
  .panel.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .sub{font-size:13px;color:var(--ink2);margin-bottom:20px}
  .daylb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 2px 12px}
  .feed{display:flex;flex-direction:column;gap:12px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .2s}
  .card:hover{border-color:var(--line2)}
  .card.open{border-color:var(--line2);box-shadow:0 4px 16px rgba(0,0,0,.06)}

  .chead{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;user-select:none}
  .chead .ic{font-size:17px;line-height:1;flex-shrink:0}
  .chead .sig{font-size:14px;font-weight:600}
  .chead .tag{margin-left:auto;font-size:10.5px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chead .chev{font-size:14px;transition:transform .3s;flex-shrink:0}
  .card.open .chead .chev{transform:rotate(180deg)}

  .amber .chead{background:var(--amber-soft)} .amber .chead .ic,.amber .chead .sig{color:var(--amber-ink)}
  .amber .chead .tag{background:rgba(184,117,20,.15);color:var(--amber-ink)} .amber .chead .chev{color:var(--amber)}
  .coral .chead{background:var(--coral-soft)} .coral .chead .ic,.coral .chead .sig{color:var(--coral-ink)}
  .coral .chead .tag{background:rgba(194,75,38,.14);color:var(--coral-ink)} .coral .chead .chev{color:var(--coral)}
  .blue .chead{background:var(--blue-soft)} .blue .chead .ic,.blue .chead .sig{color:var(--blue-ink)}
  .blue .chead .tag{background:rgba(44,109,176,.14);color:var(--blue-ink)} .blue .chead .chev{color:var(--blue)}
  .purple .chead{background:var(--purple-soft)} .purple .chead .ic,.purple .chead .sig{color:var(--purple-ink)}
  .purple .chead .tag{background:rgba(106,90,196,.14);color:var(--purple-ink)} .purple .chead .chev{color:var(--purple)}

  .sigrow{padding:11px 15px 13px;display:flex;gap:9px}
  .sigrow .ric{font-size:14px;color:var(--ink3);margin-top:2px;flex-shrink:0}
  .sigrow .rtx{font-size:12.5px;color:var(--ink2)}
  .sigrow .rtx .lb{color:var(--ink3)}
  .card.open .sigrow{display:none}

  .exp{max-height:0;overflow:hidden;transition:max-height .45s ease}
  .card.open .exp{max-height:1600px}
  .divide{height:1px;background:var(--line);margin:0 15px}
  .seclb{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:14px 15px 8px}

  .load .ln{height:10px;border-radius:5px;margin:7px 15px;
    background:linear-gradient(90deg,var(--line) 25%,#EEEDE8 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .evf{padding:0 15px}
  .evi{display:flex;gap:9px;padding:5px 0;font-size:12.8px;color:var(--ink2)}
  .evi .b{color:var(--accent);margin-top:3px;font-size:11px}
  .evi b{font-weight:600;color:var(--ink)}

  .draft{margin:6px 15px 0;border:1px solid var(--line);border-radius:10px;background:#FBFAF7}
  .draft .dh{display:flex;align-items:center;gap:6px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
  .draft .dh .badge{margin-left:auto;font-size:10px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;font-weight:600}
  .draft textarea{width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:13px;color:var(--ink);line-height:1.7;padding:11px;outline:none}

  .actbar{display:flex;gap:7px;padding:12px 15px 4px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;padding:8px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);transition:.15s}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#185C44}
  .btn:active{transform:scale(.98)}
  .decide{font-size:11px;color:var(--ink3);padding:9px 15px 4px;display:flex;gap:6px}

  .chat{margin:8px 15px 0;border-top:1px dashed var(--line2);padding-top:12px}
  .chatlog{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .msg{max-width:82%;font-size:12.5px;line-height:1.6;padding:8px 11px;border-radius:12px}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ag{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.ag .who{font-size:10px;color:var(--ink3);display:block;margin-bottom:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-family:inherit;font-size:11.5px;cursor:pointer;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);transition:.15s}
  .chip:hover{background:var(--bg);color:var(--ink)}
  .chatin{display:flex;gap:7px;align-items:center;padding-bottom:14px}
  .chatin input{flex:1;font-family:inherit;font-size:12.5px;padding:9px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);outline:none}
  .chatin input:focus{border-color:var(--accent)}
  .chatin .send{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}

  .done{padding:24px 15px 26px;text-align:center;display:none}
  .card.confirmed .done{display:block}
  .card.confirmed .exp,.card.confirmed .sigrow{display:none}
  .card.confirmed .chead{background:var(--accent-soft)}
  .card.confirmed .chead .ic,.card.confirmed .chead .sig{color:var(--accent-ink)}
  .card.confirmed .chead .tag,.card.confirmed .chead .chev{display:none}
  .done .big{font-size:26px;color:var(--accent);margin-bottom:6px}
  .done h3{font-size:14px;font-weight:600;margin-bottom:3px}
  .done p{font-size:12.5px;color:var(--ink2)}
  .done .redo{margin-top:14px;font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit}

  .agwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .agtop{padding:16px 16px 4px}
  .agtop .hi{font-size:15px;font-weight:600;margin-bottom:3px}
  .agtop .hs{font-size:12.8px;color:var(--ink2)}
  .aglog{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:60px}
  .starter{padding:0 16px 8px}
  .starter .lb{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:9px}
  .sgrid{display:flex;flex-direction:column;gap:8px}
  .scard{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel);transition:.15s;text-align:left;font-family:inherit;width:100%;color:var(--ink)}
  .scard:hover{background:var(--bg);border-color:var(--line2)}
  .scard .si{font-size:16px;color:var(--accent);flex-shrink:0}
  .scard .stx{font-size:13px}
  .scard .stx .sd{font-size:11.5px;color:var(--ink3);display:block}
  .aginput{display:flex;gap:8px;align-items:center;padding:12px 16px 16px;border-top:1px solid var(--line)}
  .aginput input{flex:1;font-family:inherit;font-size:13px;padding:11px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);outline:none}
  .aginput input:focus{border-color:var(--accent)}
  .aginput .send{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}

  .foot{margin-top:26px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:15px;line-height:1.75}
  .foot b{color:var(--ink2);font-weight:600}

.green .chead{background:#E4F1EA}.green .chead .ic,.green .chead .sig{color:#124A37}
.green .chead .tag{background:rgba(29,111,83,.14);color:#124A37}.green .chead .chev{color:#1D6F53}
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.fbtn{font-size:11.5px;padding:5px 11px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flb{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-right:4px;min-width:52px}
.cno{font-size:10.5px;color:var(--ink3);margin-left:auto;padding-right:6px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">◈</span>
    <h1>성과관리 Agent — 신호 카드</h1>
  </div>
  <div class="sub" id="sub"></div>

  <div class="fbar"><span class="flb">수신 대상</span><span id="fActor"></span></div>
  <div class="fbar"><span class="flb">단계</span><span id="fStage"></span></div>
  <div class="fbar"><span class="flb">유형</span><span id="fType"></span></div>

  <div class="daylb" id="count"></div>
  <div class="feed" id="feed"></div>

  <div class="foot">
    <b>이 화면이 담은 것</b><br>
    · 신호 카탈로그 <b>02_카드문구</b> 시트의 채택 신호를 그대로 카드로 그린 것이에요<br>

    · Agent는 근거를 모아 초안까지, 확정은 사람이 합니다
  </div>
</div>

var F={actor:'전체',stage:'전체',type:'전체'};

function uniq(k){var s=[];DATA.forEach(function(d){if(s.indexOf(d[k])<0)s.push(d[k]);});return s;}

function chipbar(id,key){
  var host=document.getElementById(id),vals=['전체'].concat(uniq(key));
  host.innerHTML=vals.map(function(v){
    return '<button class="fbtn'+(F[key]===v?' on':'')+'" data-v="'+v+'">'+v+'</button>';
  }).join('');
  host.querySelectorAll('.fbtn').forEach(function(b){
    b.addEventListener('click',function(){F[key]=b.getAttribute('data-v');render();});
  });
}

function buildExp(card,c){
  var exp=card.querySelector('.exp');
  exp.innerHTML='<div class="divide"></div><div class="seclb">행동 근거 · 초안을 만든 이유</div>'+
    '<div class="load"><div class="ln" style="width:86%"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:78%"></div></div>'+
    '<div class="evf" style="display:none">'+c.ev.map(function(e){return '<div class="evi"><span class="b">•</span><span>'+e+'</span></div>';}).join('')+'</div>'+
    '<div class="seclb dlb" style="display:none">'+c.dlb+'</div>'+
    '<div class="draft dbox" style="display:none"><div class="dh"><span>◈ Agent가 작성한 초안</span><span class="badge">검토 필요</span></div><textarea rows="5">'+c.draft+'</textarea></div>'+
    '<div class="actbar abar" style="display:none"><button class="btn primary bConfirm">'+c.confirm+'</button><button class="btn bEdit">직접 수정</button><button class="btn bChat">Agent와 상의 ↓</button></div>'+
    '<div class="decide dnote" style="display:none">ⓘ Agent는 근거를 모아 초안까지 준비해요. 최종 결정은 사람이 합니다. · 저장되는 곳 — '+c.store+'</div>'+
    '<div class="chat cbox" style="display:none"><div class="chatlog"><div class="msg ag"><span class="who">Agent</span>'+c.ag0+'</div></div>'+
    '<div class="chips">'+c.chips.map(function(ch){return '<button class="chip">'+ch+'</button>';}).join('')+'</div>'+
    '<div class="chatin"><input type="text" placeholder="초안을 어떻게 바꿀까요?"><button class="send">↑</button></div></div>';
  var load=exp.querySelector('.load'),evf=exp.querySelector('.evf'),dlb=exp.querySelector('.dlb'),
      dbox=exp.querySelector('.dbox'),abar=exp.querySelector('.abar'),dnote=exp.querySelector('.dnote'),
      cbox=exp.querySelector('.cbox'),ta=exp.querySelector('textarea');
  setTimeout(function(){load.style.display='none';evf.style.display='block';dlb.style.display='block';
    dbox.style.display='block';abar.style.display='flex';dnote.style.display='flex';},800);
  exp.querySelector('.bConfirm').addEventListener('click',function(){card.classList.add('confirmed');});
  exp.querySelector('.bEdit').addEventListener('click',function(){ta.focus();});
  exp.querySelector('.bChat').addEventListener('click',function(){cbox.style.display='block';cbox.scrollIntoView({behavior:'smooth',block:'nearest'});});
  var log=exp.querySelector('.chatlog'),input=exp.querySelector('.chatin input');
  function agReply(t){var u=document.createElement('div');u.className='msg user';u.textContent=t;log.appendChild(u);
    setTimeout(function(){var a=document.createElement('div');a.className='msg ag';
      a.innerHTML='<span class="who">Agent</span>반영해서 초안을 다시 다듬었어요. 위 초안을 확인해 주세요.';log.appendChild(a);
      cbox.scrollIntoView({behavior:'smooth',block:'nearest'});},450);}
  exp.querySelectorAll('.chip').forEach(function(ch){ch.addEventListener('click',function(){agReply(ch.textContent);});});
  function s(){var v=input.value.trim();if(!v)return;input.value='';agReply(v);}
  exp.querySelector('.chatin .send').addEventListener('click',s);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')s();});
}

function render(){
  chipbar('fActor','actor');chipbar('fStage','stage');chipbar('fType','type');
  var list=DATA.filter(function(d){
    return (F.actor==='전체'||d.actor===F.actor)&&(F.stage==='전체'||d.stage===F.stage)&&(F.type==='전체'||d.type===F.type);
  });
  document.getElementById('sub').textContent=
    '신호 카탈로그에 담긴 채택 신호 '+DATA.length+'건을 카드로 그린 화면이에요. 위에서 걸러 보고, 카드를 눌러 펼쳐 보세요.';
  document.getElementById('count').textContent='카드 '+list.length+'장';
  var feed=document.getElementById('feed');
  feed.innerHTML='';
  list.forEach(function(c){
    var card=document.createElement('div');
    card.className='card '+c.cls;
    card.innerHTML='<div class="chead"><span class="ic">'+c.ic+'</span><span class="sig">'+c.sig+'</span>'+
      '<span class="tag">'+c.stage+'</span><span class="cno">'+c.no+' · '+c.actor+'</span><span class="chev">⌄</span></div>'+
      '<div class="sigrow"><span class="ric">◍</span><span class="rtx"><span class="lb">신호 근거 · </span>'+c.srow+'</span></div>'+
      '<div class="exp"></div>'+
      '<div class="done"><div class="big">✓</div><h3>'+c.done[0]+'</h3><p>'+c.done[1]+'</p><button class="redo">↺ 다시 보기</button></div>';
    feed.appendChild(card);
    var head=card.querySelector('.chead'),built=false;
    head.addEventListener('click',function(){
      if(card.classList.contains('confirmed'))return;
      if(!card.classList.contains('open')){if(!built){buildExp(card,c);built=true;}card.classList.add('open');}
      else{card.classList.remove('open');built=false;}
    });
    card.querySelector('.redo').addEventListener('click',function(){card.classList.remove('confirmed');card.classList.remove('open');built=false;});
  });
}
render();
</script>
